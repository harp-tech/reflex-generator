[project]
name = "harp-generators-interop"
version = "0"
description = "Cross-stack interop test for the generated Python device interface."
requires-python = ">=3.11"
# harp-protocol and harp-device are pinned to a pyharp unified-API PR commit until published to
# PyPI. This commit moved the packages under src/packages and added harp.device.REGISTER_MAP.
dependencies = [
    "harp-protocol @ git+https://github.com/harp-tech/pyharp.git@0f0365a3fb1ebd68c4f3a8c421375bfce22aeb37#subdirectory=src/packages/harp-protocol",
    "harp-device @ git+https://github.com/harp-tech/pyharp.git@0f0365a3fb1ebd68c4f3a8c421375bfce22aeb37#subdirectory=src/packages/harp-device",
    "harp-data @ git+https://github.com/harp-tech/pyharp.git@0f0365a3fb1ebd68c4f3a8c421375bfce22aeb37#subdirectory=src/packages/harp-data",
    "pytest>=8",
]
