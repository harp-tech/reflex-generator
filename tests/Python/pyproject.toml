[project]
name = "harp-generators-interop"
version = "0"
description = "Cross-stack interop test for the generated Python device interface."
requires-python = ">=3.11"
# harp-protocol and harp-device are pinned to a pyharp unified-API PR commit until published to
# PyPI. This revision replaced BitFlag with the BitMask notation and gave AnonymousPayload a
# single __value__ field carrying the register interface type.
dependencies = [
    "harp-protocol @ git+https://github.com/harp-tech/pyharp.git@5716d5352637e0844212c4b33d4c52e599bc7571#subdirectory=src/packages/harp-protocol",
    "harp-device @ git+https://github.com/harp-tech/pyharp.git@5716d5352637e0844212c4b33d4c52e599bc7571#subdirectory=src/packages/harp-device",
    "pytest>=8",
]
